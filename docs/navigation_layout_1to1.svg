<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1040" viewBox="0 0 240 355">
  <defs>
    <style>
      .wall { stroke:#111; stroke-width:2.2; fill:none; stroke-linecap:square; }
      .open { stroke:#888; stroke-width:0.8; fill:none; stroke-dasharray:3 2; }
      .zone { stroke:#444; stroke-width:0.8; fill:#f7f7f7; }
      .fixed { stroke:#111; stroke-width:1; fill:#d8d8d8; }
      .vehicle { stroke:#a11; stroke-width:1; fill:#ffd9d9; }
      .pallet { stroke:#8a4f13; stroke-width:0.65; fill:#f2d2a4; }
      .label { font-family:'DejaVu Sans',sans-serif; font-size:5px; fill:#111; text-anchor:middle; }
      .small { font-family:'DejaVu Sans',sans-serif; font-size:4px; fill:#333; text-anchor:middle; }
      .title { font-family:'DejaVu Sans',sans-serif; font-size:7px; font-weight:bold; fill:#111; }
      .note { font-family:'DejaVu Sans',sans-serif; font-size:4.2px; fill:#333; }
    </style>
  </defs>

  <rect width="240" height="355" fill="white"/>
  <text x="15" y="12" class="title">Warehouse layout — 1:1 source dimensions (cm)</text>
  <text x="15" y="19" class="note">Origin: lower-left of main floor · solid black: wall · gray: fixed structure · red: rover footprint</text>

  <!-- Floor and collision geometry use source coordinates, with +Y pointing upward. -->
  <g transform="translate(20 335) scale(1 -1)">
    <path d="M0 0 H120 V180 H180 V315 H0 Z" fill="#fafafa" stroke="#aaa" stroke-width="0.7"/>
    <rect x="120" y="180" width="60" height="135" fill="#e8f1f8" stroke="#777" stroke-width="0.5"/>

    <!-- Perimeter and partitions. -->
    <path class="wall" d="M0 0 H120 M0 315 H120 M0 0 V6 M0 16 V315 M120 0 V6 M120 20 V180 M100 180 H120"/>
    <path class="open" d="M180 180 V315"/>

    <!-- Fixed machinery. -->
    <rect class="fixed" x="11" y="10" width="90" height="6"/>
    <rect class="fixed" x="35" y="17.5" width="26" height="12"/>
    <line x1="20" y1="23.5" x2="100" y2="23.5" stroke="#555" stroke-width="1.5" stroke-dasharray="2 1"/>
    <rect class="fixed" x="0" y="105" width="18" height="70"/>
    <rect class="fixed" x="60" y="256" width="10" height="58"/>

    <!-- Marked pallet/work zones. -->
    <g fill="#fff4cf" stroke="#9a7a00" stroke-width="0.6">
      <rect x="16.5" y="31" width="15" height="15"/>
      <rect x="40.5" y="31" width="15" height="15"/>
      <rect x="64.5" y="31" width="15" height="15"/>
      <rect x="88.5" y="31" width="15" height="15"/>
    </g>
    <rect x="62.5" y="122.5" width="55" height="55" fill="#dcefe2" stroke="#28734a" stroke-width="0.8"/>
    <rect x="2.5" y="257.5" width="55" height="55" fill="#dce7f4" stroke="#285b8e" stroke-width="0.8"/>

    <!-- 13 x 13 cm pallet slots: FRESH 3x3 and NORMAL 3x3. -->
    <path class="pallet" d="M65.167 125.167h13v13h-13z M83.5 125.167h13v13h-13z M101.833 125.167h13v13h-13z M65.167 143.5h13v13h-13z M83.5 143.5h13v13h-13z M101.833 143.5h13v13h-13z M65.167 161.833h13v13h-13z M83.5 161.833h13v13h-13z M101.833 161.833h13v13h-13z"/>
    <path class="pallet" d="M5.167 260.167h13v13h-13z M23.5 260.167h13v13h-13z M41.833 260.167h13v13h-13z M5.167 278.5h13v13h-13z M23.5 278.5h13v13h-13z M41.833 278.5h13v13h-13z M5.167 296.833h13v13h-13z M23.5 296.833h13v13h-13z M41.833 296.833h13v13h-13z"/>

    <!-- Dock 1: 8 rows along Y x 4 columns along X, each pallet 13 x 13 cm. -->
    <path class="pallet" d="M121 182h13v13h-13z M136 182h13v13h-13z M151 182h13v13h-13z M166 182h13v13h-13z M121 199h13v13h-13z M136 199h13v13h-13z M151 199h13v13h-13z M166 199h13v13h-13z M121 216h13v13h-13z M136 216h13v13h-13z M151 216h13v13h-13z M166 216h13v13h-13z M121 233h13v13h-13z M136 233h13v13h-13z M151 233h13v13h-13z M166 233h13v13h-13z M121 250h13v13h-13z M136 250h13v13h-13z M151 250h13v13h-13z M166 250h13v13h-13z M121 267h13v13h-13z M136 267h13v13h-13z M151 267h13v13h-13z M166 267h13v13h-13z M121 284h13v13h-13z M136 284h13v13h-13z M151 284h13v13h-13z M166 284h13v13h-13z M121 301h13v13h-13z M136 301h13v13h-13z M151 301h13v13h-13z M166 301h13v13h-13z"/>
    <g fill="none" stroke="#b33" stroke-width="0.6" stroke-dasharray="2 1">
      <rect x="3.75" y="87.5" width="15" height="15"/>
      <rect x="3.75" y="177.5" width="15" height="15"/>
      <rect x="101.25" y="105" width="15" height="15"/>
    </g>

    <!-- Initial rover footprints: length 40 along +X, width 17 along Y. -->
    <rect class="vehicle" x="61.5" y="257.5" width="40" height="17"/>
    <path d="M101.5 266 L96 263 L96 269 Z" fill="#a11"/>
    <rect class="vehicle" x="61.5" y="295.5" width="40" height="17"/>
    <path d="M101.5 304 L96 301 L96 307 Z" fill="#a11"/>

    <!-- Dock guards, simplified to their registered plan envelopes. -->
    <g fill="#333" stroke="none">
      <rect x="125" y="169.5" width="20" height="12"/>
      <rect x="155" y="169.5" width="20" height="12"/>
      <rect x="125" y="313.5" width="20" height="12"/>
      <rect x="155" y="313.5" width="20" height="12"/>
    </g>
  </g>

  <!-- Labels use already-flipped screen Y = 335 - source Y. -->
  <g>
    <text x="80" y="176" class="label">MAIN FLOOR 120 × 315</text>
    <text x="170" y="176" class="label">DOCK 1 · 8 × 4</text>
    <text x="170" y="181" class="small">32 pallet slots</text>

    <text x="76" y="322" class="small">CONVEYOR 90 × 6</text>
    <text x="68" y="309" class="small">DOFBOT + rail</text>
    <text x="44" y="298" class="small">Y1</text>
    <text x="68" y="298" class="small">Y2</text>
    <text x="92" y="298" class="small">Y3</text>
    <text x="116" y="298" class="small">Y4</text>

    <text x="29" y="199" class="label" transform="rotate(-90 29 199)">PICO ELEVATOR</text>
    <text x="110" y="185" class="label">FRESH · 3 × 3</text>
    <text x="50" y="51" class="label">NORMAL · 3 × 3</text>
    <text x="85" y="50" class="small" transform="rotate(-90 85 50)">CHARGER</text>
    <text x="101.5" y="71" class="small">MAIN rover 17 × 40</text>
    <text x="101.5" y="33" class="small">AUX rover 17 × 40</text>

    <text x="8" y="338" class="small">(0,0)</text>
    <text x="140" y="343" class="small">120 cm</text>
    <text x="218" y="178" class="small" transform="rotate(-90 218 178)">315 cm</text>
    <text x="200" y="255" class="note">Dashed red boxes:</text>
    <text x="200" y="261" class="note">empty-pallet zones</text>
    <text x="200" y="272" class="note">Dock face at x=180:</text>
    <text x="200" y="278" class="note">open, no wall</text>
    <text x="200" y="289" class="note">Drawing excludes safety</text>
    <text x="200" y="295" class="note">clearance inflation.</text>
    <text x="200" y="306" class="note">Pallet slot: 13 × 13 cm</text>
  </g>
</svg>
