services:
  inventory-api:
    build:
      context: .
    environment:
      INVENTORY_DB_PATH: ${INVENTORY_DB_PATH:-/data/inventory.db}
    ports:
      - "${INVENTORY_API_HOST:-127.0.0.1}:${INVENTORY_API_PORT:-8081}:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
