promotion_package:
  source_owner: yeongpyo
  claims:
  - claim_id: mentorpi-fastdds-discovery-server-architecture
    content: The MentorPi Fast DDS deployment centralizes only DDS discovery through
      a Discovery Server on UDP 11811; matched ROS 2 endpoint payload remains direct
      UDPv4 traffic between vehicles and consumers rather than being relayed by the
      server.
    target_section: concepts/fast-dds-domain-bridge
  - claim_id: mentorpi-domain-isolation-and-telemetry-bridge
    content: The standalone bridge keeps robot_1 and robot_2 in separate source DDS
      Domains (default 1 and 2) and forwards an explicit, one-way telemetry allowlist
      to central Domain 215; it excludes cmd_vel and other control topics.
    target_section: concepts/fast-dds-domain-bridge
  - claim_id: mentorpi-fastdds-operational-boundaries
    content: The Fast DDS bridge requires rmw_fastrtps_cpp, a reachable central Discovery
      Server IPv4 locator, UDPv4 transport, and Linux host networking; the original
      MentorPi runtime documents a separate CycloneDDS default, so the two middleware
      configurations must be selected explicitly rather than mixed implicitly.
    target_section: concepts/fast-dds-domain-bridge
  evidence_digest:
  - Static analysis on 2026-08-13 of the standalone dds-domain-bridge compose, entrypoint,
    Fast DDS environment helper, observer, and explicit bridge template confirmed
    the service topology, Domain validation, Discovery Server command, diagnostic
    Super Client handling, and 16-topic telemetry allowlist.
  - The refined page records the official Fast DDS Discovery Server model and distinguishes
    discovery control traffic from direct user payload traffic.
  - Selected Project wiki records the original MentorPi .typerc default as CycloneDDS
    with ROS_DOMAIN_ID=0; the refined page treats Fast DDS as a separate, explicit
    deployment configuration.
  - No central Linux server or physical MentorPi end-to-end test was run; firewall
    reachability, actual topic names/types, QoS compatibility, and live telemetry
    remain runtime verification items.
