x-runtime-environment: &runtime-environment
  GZ_PARTITION: mentorpi-sim
  ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
  LIBGL_ALWAYS_SOFTWARE: "${LIBGL_ALWAYS_SOFTWARE:-1}"
  IMAGE_VERSION: "${MENTORPI_IMAGE:-mentorpi-sim:harmonic}"
  SESSION_ID: "${SESSION_ID:-none}"
  ROBOT_IDS: "${ROBOT_IDS:-robot_1,robot_2}"

x-runtime: &runtime
  image: "${MENTORPI_IMAGE:-mentorpi-sim:harmonic}"
  platform: ${TARGET_PLATFORM:-linux/amd64}
  environment: *runtime-environment
  networks:
    - mentorpi
  restart: unless-stopped

services:
  gazebo-server:
    <<: *runtime
    environment:
      <<: *runtime-environment
      SERVICE_NAME: gazebo-server
    command: ros2 launch mentorpi_gz_sim gazebo_server.launch.py
    healthcheck:
      test: ['CMD-SHELL', 'gz topic -l | grep -q /world/mentorpi_warehouse/stats']
      interval: 5s
      timeout: 3s
      retries: 20

  sim-adapter:
    <<: *runtime
    environment:
      <<: *runtime-environment
      SERVICE_NAME: sim-adapter
    command: ros2 launch mentorpi_gz_sim sim_adapter.launch.py
    depends_on:
      gazebo-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -lc 'source /opt/ros/humble/setup.bash &&
          source /opt/mentorpi_ws/install/setup.bash &&
          ros2 topic list | grep -q /robot_1/scan_raw'
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  mentorpi:
    internal: true
