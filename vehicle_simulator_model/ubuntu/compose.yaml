x-runtime-environment: &runtime-environment
  GZ_PARTITION: mentorpi-sim
  ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
  LIBGL_ALWAYS_SOFTWARE: "${LIBGL_ALWAYS_SOFTWARE:-1}"
  IMAGE_VERSION: "${MENTORPI_IMAGE:-mentorpi-sim:harmonic}"
  SESSION_ID: "${SESSION_ID:-none}"
  ROBOT_IDS: "${ROBOT_IDS:-robot_1,robot_2}"

x-runtime: &runtime
  image: "${MENTORPI_IMAGE:-mentorpi-sim:harmonic}"
  platform: ${TARGET_PLATFORM:-linux/amd64}
  environment: *runtime-environment
  networks:
    - mentorpi
  restart: unless-stopped

services:
  gazebo-server:
    <<: *runtime
    environment:
      <<: *runtime-environment
      SERVICE_NAME: gazebo-server
    command: ros2 launch mentorpi_gz_sim gazebo_server.launch.py
    healthcheck:
      test: ['CMD', '/usr/local/bin/mentorpi-healthcheck', 'server']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 5s

  sim-adapter:
    <<: *runtime
    environment:
      <<: *runtime-environment
      SERVICE_NAME: sim-adapter
      GZ_RELAY_HOST: gazebo-server
    command: ros2 launch mentorpi_gz_sim sim_adapter.launch.py
    depends_on:
      gazebo-server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/usr/local/bin/mentorpi-healthcheck', 'adapter']
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 10s

networks:
  mentorpi:
    internal: true
