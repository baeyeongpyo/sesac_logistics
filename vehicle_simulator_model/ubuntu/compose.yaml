x-runtime-environment: &runtime-environment
  GZ_PARTITION: mentorpi-sim
  ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
  LIBGL_ALWAYS_SOFTWARE: "${LIBGL_ALWAYS_SOFTWARE:-1}"
  IMAGE_VERSION: "${MENTORPI_IMAGE:-mentorpi-sim:harmonic}"
  ROBOT_IDS: "${ROBOT_IDS:-robot_1,robot_2}"

x-dds-client-environment: &dds-client-environment
  <<: *runtime-environment
  DDS_DISCOVERY_HOST: dds-discovery
  DDS_DISCOVERY_PORT: "11811"
  FASTDDS_BUILTIN_TRANSPORTS: "UDPv4"

x-runtime: &runtime
  image: "${MENTORPI_IMAGE:-mentorpi-sim:harmonic}"
  platform: ${TARGET_PLATFORM:-linux/amd64}
  environment: *runtime-environment
  restart: unless-stopped

x-runtime-networked: &runtime-networked
  <<: *runtime
  networks:
    - mentorpi

services:
  dds-discovery:
    <<: *runtime-networked
    environment:
      <<: *runtime-environment
      SERVICE_NAME: dds-discovery
    command:
      [fastdds, discovery, -i, "0", -l, 0.0.0.0, -p, "11811"]

  gazebo-server:
    <<: *runtime-networked
    environment:
      <<: *runtime-environment
      SERVICE_NAME: gazebo-server
    command: ros2 launch mentorpi_gz_sim gazebo_server.launch.py
    healthcheck:
      test: ['CMD', '/usr/local/bin/mentorpi-healthcheck', 'server']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 5s

  sim-adapter:
    <<: *runtime-networked
    environment:
      <<: *dds-client-environment
      SERVICE_NAME: sim-adapter
      GZ_RELAY_HOST: gazebo-server
    command: ros2 launch mentorpi_gz_sim sim_adapter.launch.py
    depends_on:
      dds-discovery:
        condition: service_started
      gazebo-server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/usr/local/bin/mentorpi-healthcheck', 'adapter']
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 10s

  slam-data-init:
    <<: *runtime-networked
    profiles: [mapping]
    restart: "no"
    user: "0:0"
    environment:
      <<: *runtime-environment
      SERVICE_NAME: slam-data-init
    command: chown 1000:1000 /slam-data
    volumes:
      - slam-data:/slam-data

  slam-mapper:
    <<: *runtime-networked
    profiles: [mapping]
    restart: "no"
    stop_grace_period: 30s
    environment:
      <<: *dds-client-environment
      SERVICE_NAME: slam-mapper
      SESSION_ID: "${SESSION_ID:-none}"
      SLAM_DATA_ROOT: /slam-data
      IMAGE_VERSION: "${IMAGE_VERSION:-mentorpi-sim:harmonic}"
      GIT_COMMIT: "${GIT_COMMIT:-unknown}"
      WORLD_VERSION: "${WORLD_VERSION:-unknown}"
      MODEL_VERSION: "${MODEL_VERSION:-unknown}"
      TF_CALIBRATION_VERSION: "${TF_CALIBRATION_VERSION:-unknown}"
    command: /opt/mentorpi_ws/install/mentorpi_slam/lib/mentorpi_slam/run_mapping_session.sh
    depends_on:
      dds-discovery:
        condition: service_started
      sim-adapter:
        condition: service_healthy
      slam-data-init:
        condition: service_completed_successfully
    volumes:
      - slam-data:/slam-data

  slam-inspector:
    <<: *runtime-networked
    profiles: [mapping]
    restart: "no"
    environment:
      <<: *runtime-environment
      SERVICE_NAME: slam-inspector
      SESSION_ID: "${SESSION_ID:-none}"
    command: bash
    volumes:
      - type: volume
        source: slam-data
        target: /slam-data
        read_only: true

networks:
  mentorpi:
    internal: true

volumes:
  slam-data:
    name: "${SLAM_VOLUME_NAME:-mentorpi-slam-data}"
