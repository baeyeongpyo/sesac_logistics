name: mentorpi-dds-observation

x-domain-bridge-environment: &domain-bridge-environment
  CONTROL_DOMAIN: "225"
  SOURCE_NAMESPACE: "/"

x-domain-bridge: &domain-bridge
  build:
    context: ./domain-bridge
  image: "${DOMAIN_BRIDGE_IMAGE:-mentorpi-domain-bridge:humble}"
  network_mode: host
  ipc: host
  restart: unless-stopped
  command: [/usr/local/bin/run-domain-bridge]

# 실차 관측 전용 구성이다. 각 bridge 컨테이너가 차량 Domain과 중앙 Domain 225의
# DDS participant를 함께 생성해 명시된 토픽만 중개한다.
services:
  bridge-robot-1:
    <<: *domain-bridge
    environment:
      <<: *domain-bridge-environment
      VEHICLE_DOMAIN: "215"
      CENTRAL_PREFIX: "/robot_1"

  bridge-robot-2:
    <<: *domain-bridge
    environment:
      <<: *domain-bridge-environment
      VEHICLE_DOMAIN: "216"
      CENTRAL_PREFIX: "/robot_2"

  foxglove-bridge:
    build:
      context: .
    image: "${DDS_OBSERVATION_IMAGE:-mentorpi-dds-observation:humble}"
    network_mode: host
    # network_mode: host와 함께 Fast DDS SHM transport가 컨테이너 간에도
    # 동작하려면 host IPC namespace를 공유해야 한다.
    ipc: host
    restart: unless-stopped
    environment:
      SERVICE_NAME: foxglove-bridge
      ROS_DOMAIN_ID: "225"
      ROBOT_IDS: robot_1,robot_2
    command:
      [ros2, launch, foxglove_bridge, foxglove_bridge_launch.xml,
       "address:=${FOXGLOVE_BIND_ADDRESS:-0.0.0.0}",
       "port:=${FOXGLOVE_PORT:-8765}"]
    depends_on:
      bridge-robot-1:
        condition: service_started
      bridge-robot-2:
        condition: service_started

  map-server:
    build:
      context: .
    image: "${DDS_OBSERVATION_IMAGE:-mentorpi-dds-observation:humble}"
    network_mode: host
    # map-server와 foxglove-bridge가 동일한 Fast DDS SHM space를 사용한다.
    ipc: host
    # Named overlay는 최초 생성 시 root 소유이므로, bootstrap이 소유권을
    # 초기화한 뒤 ros 사용자로 빌드·실행한다.
    user: "0:0"
    restart: unless-stopped
    environment:
      SERVICE_NAME: map-server
      ROS_DOMAIN_ID: "225"
      MAP_YAML: /maps/map.yaml
      MAP_USE_SIM_TIME: "${MAP_USE_SIM_TIME:-false}"
    volumes:
      - type: volume
        source: map-server-overlay
        target: /ws
      - type: bind
        source: ../ros2_ws/src/mentorpi_map_server
        target: /ws/src/mentorpi_map_server
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MAP_DIRECTORY:?MAP_DIRECTORY is required}
        target: /maps
        read_only: true
        bind:
          create_host_path: false
    command: [/usr/local/bin/mentorpi-map-server-bootstrap]
    depends_on:
      bridge-robot-1:
        condition: service_started
      bridge-robot-2:
        condition: service_started

  rosbag-recorder:
    build:
      context: .
    image: "${DDS_OBSERVATION_IMAGE:-mentorpi-dds-observation:humble}"
    network_mode: host
    # Docker named volume은 처음 생성될 때 root 소유이므로, 시작 래퍼가
    # /rosbag의 소유권만 초기화한 뒤 ros 사용자로 recorder를 실행한다.
    user: "0:0"
    restart: unless-stopped
    environment:
      SERVICE_NAME: rosbag-recorder
      ROS_DOMAIN_ID: "225"
      ROBOT_IDS: robot_1,robot_2
      ROSBAG_ROOT: /rosbag
      ROSBAG_SESSION_ID: "${ROSBAG_SESSION_ID:-}"
    volumes:
      - type: bind
        source: ${ROSBAG_HOST_DIRECTORY:?ROSBAG_HOST_DIRECTORY is required}
        target: /rosbag
        bind:
          create_host_path: false
    command: [/usr/local/bin/mentorpi-rosbag-recorder-bootstrap]
    depends_on:
      bridge-robot-1:
        condition: service_started
      bridge-robot-2:
        condition: service_started

volumes:
  map-server-overlay:
    name: "${MAP_SERVER_OVERLAY_VOLUME:-mentorpi-map-server-overlay}"
