name: mentorpi-dds-observation

# 실차 관측 전용 구성이다. 모든 participant는 ROS Domain 215에서 multicast
# discovery를 사용하며, Gazebo·DDS Discovery Server·DDS Domain Bridge에는 의존하지 않는다.
services:
  foxglove-bridge:
    build:
      context: .
    image: "${DDS_OBSERVATION_IMAGE:-mentorpi-dds-observation:humble}"
    network_mode: host
    # network_mode: host와 함께 Fast DDS SHM transport가 컨테이너 간에도
    # 동작하려면 host IPC namespace를 공유해야 한다.
    ipc: host
    restart: unless-stopped
    environment:
      SERVICE_NAME: foxglove-bridge
      ROS_DOMAIN_ID: "225"
      ROBOT_IDS: robot_1,robot_2
    command:
      [ros2, launch, foxglove_bridge, foxglove_bridge_launch.xml,
       "address:=${FOXGLOVE_BIND_ADDRESS:-0.0.0.0}",
       "port:=${FOXGLOVE_PORT:-8765}"]

  map-server:
    build:
      context: .
    image: "${DDS_OBSERVATION_IMAGE:-mentorpi-dds-observation:humble}"
    network_mode: host
    # map-server와 foxglove-bridge가 동일한 Fast DDS SHM space를 사용한다.
    ipc: host
    # Named overlay는 최초 생성 시 root 소유이므로, bootstrap이 소유권을
    # 초기화한 뒤 ros 사용자로 빌드·실행한다.
    user: "0:0"
    restart: unless-stopped
    environment:
      SERVICE_NAME: map-server
      ROS_DOMAIN_ID: "225"
      MAP_YAML: /maps/map.yaml
      MAP_USE_SIM_TIME: "${MAP_USE_SIM_TIME:-false}"
    volumes:
      - type: volume
        source: map-server-overlay
        target: /ws
      - type: bind
        source: ../ros2_ws/src/mentorpi_map_server
        target: /ws/src/mentorpi_map_server
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MAP_DIRECTORY:?MAP_DIRECTORY is required}
        target: /maps
        read_only: true
        bind:
          create_host_path: false
    command: [/usr/local/bin/mentorpi-map-server-bootstrap]

  rosbag-recorder:
    build:
      context: .
    image: "${DDS_OBSERVATION_IMAGE:-mentorpi-dds-observation:humble}"
    network_mode: host
    # Docker named volume은 처음 생성될 때 root 소유이므로, 시작 래퍼가
    # /rosbag의 소유권만 초기화한 뒤 ros 사용자로 recorder를 실행한다.
    user: "0:0"
    restart: unless-stopped
    environment:
      SERVICE_NAME: rosbag-recorder
      ROS_DOMAIN_ID: "225"
      ROBOT_IDS: robot_1,robot_2
      ROSBAG_ROOT: /rosbag
      ROSBAG_SESSION_ID: "${ROSBAG_SESSION_ID:-}"
    volumes:
      - type: bind
        source: ${ROSBAG_HOST_DIRECTORY:?ROSBAG_HOST_DIRECTORY is required}
        target: /rosbag
        bind:
          create_host_path: false
    command: [/usr/local/bin/mentorpi-rosbag-recorder-bootstrap]

volumes:
  map-server-overlay:
    name: "${MAP_SERVER_OVERLAY_VOLUME:-mentorpi-map-server-overlay}"
