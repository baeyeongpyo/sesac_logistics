name: mentorpi-dds-domain-bridge

services:
  dds-discovery:
    build:
      context: .
    image: "${DDS_DOMAIN_BRIDGE_IMAGE:-mentorpi-dds-domain-bridge:humble}"
    network_mode: host
    restart: unless-stopped
    environment:
      SERVICE_NAME: dds-discovery
    command:
      [fastdds, discovery, -i, "0", -l, 0.0.0.0, -p, "${DDS_DISCOVERY_PORT:-11811}"]

  dds-domain-bridge:
    build:
      context: .
    image: "${DDS_DOMAIN_BRIDGE_IMAGE:-mentorpi-dds-domain-bridge:humble}"
    network_mode: host
    restart: unless-stopped
    environment:
      SERVICE_NAME: dds-domain-bridge
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: "${CENTRAL_DOMAIN_ID:-215}"
      CENTRAL_DOMAIN_ID: "${CENTRAL_DOMAIN_ID:-215}"
      ROBOT_1_DOMAIN_ID: "${ROBOT_1_DOMAIN_ID:-1}"
      ROBOT_2_DOMAIN_ID: "${ROBOT_2_DOMAIN_ID:-2}"
      DDS_DISCOVERY_HOST: 127.0.0.1
      DDS_DISCOVERY_PORT: "${DDS_DISCOVERY_PORT:-11811}"
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
    volumes:
      - type: bind
        source: ./bridge.yaml.template
        target: /etc/dds-domain-bridge/bridge.yaml.template
        read_only: true
    depends_on:
      dds-discovery:
        condition: service_started
    command:
      [ros2, run, domain_bridge, domain_bridge, /tmp/dds-domain-bridge.yaml]
