collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: controller/cmd_vel
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [PolygonStop, PolygonSlow]
    PolygonStop:
      type: polygon
      points: [0.24, 0.15, 0.24, -0.15, -0.13, -0.15, -0.13, 0.15]
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true
    PolygonSlow:
      type: polygon
      points: [0.42, 0.23, 0.42, -0.23, -0.20, -0.23, -0.20, 0.23]
      action_type: slowdown
      max_points: 3
      slowdown_ratio: 0.35
      visualize: true
      polygon_pub_topic: polygon_slow
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: scan_raw
      enabled: true
