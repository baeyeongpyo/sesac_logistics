# Project-owned runtime source stack for llm-wiki-core.
# Dependency records only say what can be loaded. Usage semantics live under
# mutable_source_wiki_policy.source_binding_order.

wiki_artifacts:
  - dependency_id: vehicle
    artifact_ref: artifacts/vehicle
    namespace: vehicle:wiki
  # - dependency_id: tracking-vehicle
  #   artifact_ref: artifacts/tracking-vehicle
  #   namespace: tracking-vehicle:wiki
  # - dependency_id: programming-architecture
  #   artifact_ref: artifacts/programming-architecture
  #   namespace: programming-architecture:wiki

promotion_shelves:
  - dependency_id: local-promotion-shelf
    shelf_ref: promotion-shelf

personal_wikis: []

selection_policy:
  default_mode: active-work
  conflict_resolution:
    default_action: ask_user
    record_user_decision: true
    autonomous_allowed: false
  priority_rules:
    priority_source: yaml_order
    earlier_entry_has_higher_priority: true
    group_block_has_equal_priority: true
    priority_grants_canonical_authority: false

mutable_source_wiki_policy:
  source_binding_order:
    - source_binding_id: vehicle
      dependency_id: vehicle
      dependency_type: artifact
      effective_scope: project
      authority_level: policy
    # - source_binding_id: tracking-vehicle
    #   dependency_id: tracking-vehicle
    #   dependency_type: artifact
    #   effective_scope: team
    #   authority_level: policy
    # - source_binding_id: programming-architecture
    #   dependency_id: programming-architecture
    #   dependency_type: artifact
    #   effective_scope: team
    #   authority_level: policy

    - source_binding_id: local-promotion-shelf
    - source_binding_id: local-mutable-wiki
