services:
  fleet-manager-api:
    build:
      context: .
    environment:
      FLEET_MANAGER_DB_PATH: ${FLEET_MANAGER_DB_PATH:-/data/fleet_manager.db}
    ports:
      - "${FLEET_MANAGER_API_HOST:-127.0.0.1}:${FLEET_MANAGER_API_PORT:-8082}:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
