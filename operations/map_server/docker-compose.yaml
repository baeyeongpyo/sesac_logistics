services:
  map-publisher:
    image: ${MAP_SERVER_IMAGE:-mentorpi-map-server:humble}
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    ipc: host
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 10s
    environment:
      ROS_DOMAIN_ID: ${SERVER_ROS_DOMAIN_ID:-225}
      ROS_LOCALHOST_ONLY: "1"
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTDDS_BUILTIN_TRANSPORTS: ${FASTDDS_BUILTIN_TRANSPORTS:-DEFAULT}
      MAP_YAML: ${MAP_YAML:-/maps/map_0825.yaml}
      MAP_USE_SIM_TIME: ${MAP_USE_SIM_TIME:-false}
    volumes:
      - type: bind
        source: ${MAP_DIRECTORY:-./maps}
        target: /maps
        read_only: true
        bind:
          create_host_path: false
    command:
      - ros2
      - run
      - central_map_server
      - central_map_publisher
      - --ros-args
      - -p
      - "use_sim_time:=${MAP_USE_SIM_TIME:-false}"
