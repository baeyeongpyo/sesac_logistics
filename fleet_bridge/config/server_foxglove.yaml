foxglove_bridge:
  ros__parameters:
    address: 0.0.0.0
    port: 8765
    topic_whitelist:
      - ^/robot_(1|2)/(odom|tf|tf_static|amcl_pose|scan_raw|scan_filtered|imu/data_raw|battery|diagnostics|rgb/image_raw|move_base_simple/goal|navigation/status|navigation/cmd_vel|controller/cmd_vel|fleet_bridge/status)$
      - ^/controller_server/map$
    best_effort_qos_topic_whitelist:
      - ^/robot_(1|2)/(odom|tf|scan_raw|scan_filtered|imu/data_raw|rgb/image_raw)$
    service_whitelist:
      - '(?!)'
    param_whitelist:
      - '(?!)'
    client_topic_whitelist:
      - '(?!)'
    asset_uri_allowlist:
      - '(?!)'
    # Humble parameter files cannot encode an empty string array. "none" does
    # not match any capability name supported by the pinned 0.8.5 bridge.
    capabilities:
      - none
    include_hidden: false
    min_qos_depth: 1
    max_qos_depth: 20
    send_buffer_limit: 4194304
    use_compression: false
