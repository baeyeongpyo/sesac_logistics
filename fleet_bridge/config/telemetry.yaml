version: 1
topics:
  # config/tmp/vehicle_node_topic의 source/type을 그대로 유지하고 target에 차량 ID만 접두사로 붙인다.
  - id: amcl_transition_event
    enabled: true
    source: "/amcl/transition_event"
    target: "/{robot}/amcl/transition_event"
    type: lifecycle_msgs/msg/TransitionEvent
    worker_rate: {}
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10
