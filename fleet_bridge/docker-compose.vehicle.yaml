services:
  foxglove-fleet:
    image: ${VEHICLE_IMAGE:-mentorpi-fleet-bridge-vehicle:humble}
    build:
      context: .
      dockerfile: vehicle/Dockerfile
    network_mode: host
    ipc: host
    restart: unless-stopped
    environment:
      ROBOT_ID: ${ROBOT_ID:?ROBOT_ID is required}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:?ROS_DOMAIN_ID is required}
      ROS_LOCALHOST_ONLY: "1"
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTDDS_BUILTIN_TRANSPORTS: ${FASTDDS_BUILTIN_TRANSPORTS:-DEFAULT}
      TELEMETRY_CONFIG: /config/telemetry.yaml
      FOXGLOVE_MODE: fleet
      FOXGLOVE_PORT: "8766"
    volumes:
      - type: bind
        source: ./config/telemetry.yaml
        target: /config/telemetry.yaml
        read_only: true
    command: [ros2, launch, fleet_telemetry_filter, vehicle_foxglove.launch.py]

  foxglove-debug:
    profiles: [debug]
    image: ${VEHICLE_IMAGE:-mentorpi-fleet-bridge-vehicle:humble}
    build:
      context: .
      dockerfile: vehicle/Dockerfile
    network_mode: host
    ipc: host
    restart: unless-stopped
    environment:
      ROBOT_ID: ${ROBOT_ID:?ROBOT_ID is required}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:?ROS_DOMAIN_ID is required}
      ROS_LOCALHOST_ONLY: "1"
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTDDS_BUILTIN_TRANSPORTS: ${FASTDDS_BUILTIN_TRANSPORTS:-DEFAULT}
      TELEMETRY_CONFIG: /config/telemetry.yaml
      FOXGLOVE_MODE: debug
      FOXGLOVE_PORT: "8765"
    volumes:
      - type: bind
        source: ./config/telemetry.yaml
        target: /config/telemetry.yaml
        read_only: true
    command: [ros2, launch, fleet_telemetry_filter, vehicle_foxglove.launch.py]
