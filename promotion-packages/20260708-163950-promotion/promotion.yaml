promotion_package:
  source_owner: "yeongpyo"
  claims:
    - claim_id: "mentorpi-m1-product-spec-and-manual-map"
      content: "Hiwonder MentorPi M1 is a Raspberry Pi 5 and RRC Lite based ROS2 Humble Mecanum robot platform; the project notes preserve kit options, core hardware specs, sensor specs, initial setup values, and manual section mapping needed for implementation planning."
      target_section: "sources/hiwonder-mentorpi-m1"
    - claim_id: "mentorpi-getting-ready-runtime-code-map"
      content: "The MentorPi Getting Ready behaviors map primarily to bringup.launch.py, startup_check.py, start_app.launch.py, app feature nodes, joystick_control.launch.py, controller, ros_robot_controller, and the .zshrc/.robotrc/.typerc runtime environment chain."
      target_section: "sources/hiwonder-mentorpi-getting-ready-implementation-guide"
    - claim_id: "mentorpi-group-control-code-map"
      content: "The Master-Slave and Group Control tutorial maps to the multi package: multi_controller.launch.py starts each namespaced controller stack, joystick_control_multi.py broadcasts /joy-derived Twist and buzzer commands to robot_N namespaces, and controller/ros_robot_controller nodes bridge those commands to hardware."
      target_section: "sources/hiwonder-mentorpi-group-control-code-map"
  evidence_digest:
