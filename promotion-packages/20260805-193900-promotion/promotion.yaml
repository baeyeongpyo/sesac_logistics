promotion_package:
  source_owner: "yeongpyo"
  claims:
    - claim_id: "mentorpi-nav2-map-mode-selection"
      content: "MentorPi simulator navigation selects checksum-verified saved maps for map_server plus AMCL localization and otherwise falls back to slam_toolbox mapping; the two localization providers are conditionally exclusive."
      target_section: "concepts/mentorpi-nav2-driving-logic-analysis"
    - claim_id: "mentorpi-nav2-planning-and-control-stack"
      content: "The current MentorPi Nav2 configuration uses NavfnPlanner with unknown-space traversal disabled, static/laser/inflation global costmap layers, a 4 m rolling local costmap, and Regulated Pure Pursuit path following at 15 Hz."
      target_section: "concepts/mentorpi-nav2-driving-logic-analysis"
    - claim_id: "mentorpi-nav2-command-safety-and-risks"
      content: "The simulator translates map-frame GUI goals to NavigateToPose, forwards the intended /cmd_vel_nav output through a 0.35-second watchdog relay, and requires runtime verification of cmd_vel remapping plus standard Nav2 lifecycle and parameter alignment."
      target_section: "concepts/mentorpi-nav2-driving-logic-analysis"
  evidence_digest:
    - "Static analysis of mentorpi_nav config, launch, goal bridge, velocity relay, map-session selection, SLAM configuration, compose launcher, README, and the preserved multi-robot Nav2 reference launch on 2026-08-05."
    - "The attached refined page separates code-confirmed behavior from runtime-dependent risks, including absent local remap evidence for /cmd_vel_nav and default behavior-tree dependency."
    - "Static verification passed: 9 mentorpi_nav unit/contract tests and 4 navigation-bundle tests. No Gazebo/Nav2 end-to-end run was performed."
